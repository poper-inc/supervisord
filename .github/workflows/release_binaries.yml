---
name: Release Binaries

on:
  push:
    tags:
      - '*'

jobs:

  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install UPX
        env:
          UPXVER: "4.0.2"
        run: |
          if [[ ! -f "upx/${UPXVER}/upx" ]]; then
            echo "Installing upx .."
            curl -OL "https://github.com/upx/upx/releases/download/v${UPXVER}/upx-${UPXVER}-amd64_linux.tar.xz"
            tar xvf "upx-${UPXVER}-amd64_linux.tar.xz"
            mkdir -p upx
            mv "upx-${UPXVER}-amd64_linux" "upx/${UPXVER}"
            rm -f "upx-${UPXVER}-amd64_linux.tar.xz"
          fi
          echo "$(pwd)/upx/${UPXVER}" >> $GITHUB_PATH
          export PATH="$(pwd)/upx/${UPXVER}:${PATH}"
          upx --version | grep -E '^upx'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.18

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}